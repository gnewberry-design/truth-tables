<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truth Tables in Real Life | Interactive Geometry</title><style>
:root{--bg:#080e20;--panel:#14213c;--text:#f7f9ff;--muted:#bfd0ef;--green:#5df0a1;--red:#ff7d91;--blue:#6cb9ff;--gold:#ffd76b;--purple:#c6a2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#263d73,var(--bg) 70%);font:clamp(17px,2vw,23px)/1.5 system-ui,Arial;color:var(--text)}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.pill{border:1px solid #7893cb;border-radius:99px;padding:5px 14px;color:#d5e6ff;font-size:.7em}.progress{height:8px;background:#293859;border-radius:8px;overflow:hidden;margin:16px 0}.fill{height:100%;background:linear-gradient(90deg,#54dbb2,#78b8ff);transition:width .25s}.slide{background:rgba(14,26,53,.96);border:1px solid #445b91;border-radius:24px;padding:clamp(20px,4vw,48px);min-height:570px;box-shadow:0 16px 60px #0006}.kicker{color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.7em}h1{font-size:clamp(35px,5vw,62px);line-height:1.12;margin:16px 0}h2{font-size:clamp(30px,4vw,48px);line-height:1.15;margin:10px 0 22px}p{margin:12px 0}.sub{color:var(--muted)}.callout{background:#23365c;border-left:6px solid var(--gold);border-radius:10px;padding:18px;margin:20px 0}.rule{font-size:1.15em;font-weight:800;color:var(--gold)}.symbols{display:flex;gap:14px;flex-wrap:wrap}.symbol{background:#24365d;padding:14px 22px;border-radius:12px}.t{color:var(--green);font-weight:900}.f{color:var(--red);font-weight:900}table{width:100%;border-collapse:collapse;margin:20px 0;font-size:clamp(16px,2.2vw,24px)}th,td{border:2px solid #536da3;padding:12px;text-align:center}th{background:#263e71;color:#fff}tbody tr:nth-child(even){background:#1b2c4d}.highlight{background:#315447!important}.question{background:#22355a;border-radius:15px;padding:20px;margin:20px 0}.choices{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}button{border:0;border-radius:12px;background:#344c80;color:white;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}button:hover,button:focus-visible{outline:3px solid #d4e7ff;outline-offset:2px}button:disabled{opacity:.35;cursor:default}button.true{background:#146b49}button.false{background:#923347}button.selected{outline:3px solid #fff}.feedback{padding:15px;border-radius:12px;margin-top:14px;background:#31476b}.feedback.ok{border:2px solid var(--green)}.feedback.no{border:2px solid var(--red)}.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.small{font-size:.75em;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin:20px 0}.card{background:#24365d;border-radius:14px;padding:20px}.big{font-size:1.5em}.center{text-align:center}.hide{display:none}.finish{background:#23365c;padding:20px;border-radius:16px}.skip{color:var(--muted)}@media(max-width:600px){.slide{min-height:580px}.controls button{padding:11px 14px}.app{padding:10px}th,td{padding:7px}}</style></head><body><main class="app"><header class="top"><span class="pill">📐 Geometry • Real-Life Logic</span><span class="pill" id="counter" aria-live="polite"></span></header><div class="progress"><div class="fill" id="fill"></div></div><section id="slide" class="slide" aria-live="polite"></section><nav class="controls"><button id="prev">← Previous</button><span class="small">Use ← → arrow keys to navigate</span><button id="next">Next →</button></nav><p class="small center">Interactive class presentation • Answers remain on this device only • No student data is collected</p></main><script>
const TF=(x)=>`<span class="${x?'t':'f'}">${x?'🟢 TRUE':'🔴 FALSE'}</span>`;
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${typeof x==='boolean'?TF(x):x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
const combos=[[true,true],[true,false],[false,true],[false,false]];
const slides=[
{title:'🌎 Truth Tables in Real Life!',tag:'Welcome',html:`<p class="big">🍿 🎮 📱 🐶 🍕 ☔</p><p>What do going to the movies, playing video games, and making everyday decisions have in common?</p><div class="callout"><strong>They all use LOGIC!</strong> Truth tables help us organize what is TRUE and what is FALSE.</div><p class="sub">Today: AND • OR • NOT • IF–THEN</p>`},
{title:'🎯 Why are we learning this?',tag:'Learning target',html:`<div class="cards"><div class="card">💻 <b>Technology</b><p>Apps and games use true/false rules.</p></div><div class="card">🧠 <b>Decisions</b><p>We weigh conditions before choosing.</p></div><div class="card">📐 <b>Geometry</b><p>We use logic to justify conclusions.</p></div><div class="card">🔎 <b>Critical Thinking</b><p>We check whether claims make sense.</p></div></div><p class="rule">Goal: Explain AND, OR, NOT, and IF–THEN using real-life examples.</p>`},
{title:'🟢 TRUE or 🔴 FALSE?',tag:'Warm-up',html:`<p>A statement is a sentence that can be classified as true or false.</p><div class="cards"><div class="card">🟢 <b>TRUE</b><p>“Dogs are animals.”</p></div><div class="card">🔴 <b>FALSE</b><p>“Every phone is waterproof.”</p></div></div><div class="callout">We call our first statement <b>p</b> and our second statement <b>q</b>.</div>${table(['p','q'],combos)}`},
{title:'🍿 AND: Going to the Movies',tag:'Example 1 • AND',html:`<p><b>p:</b> I have enough money. 💵</p><p><b>q:</b> I have permission. 👍</p><div class="callout">I can go to the movies if I have money <b>AND</b> permission.</div><p class="rule">AND (∧) is TRUE only when BOTH parts are TRUE.</p>${table(['💵 Money','👍 Permission','🎬 Can go?'],combos.map(([p,q])=>[p,q,p&&q]))}`},
{title:'🎮 AND: Video Game Time',tag:'Example 2 • AND',html:`<p><b>p:</b> My homework is finished. 📚</p><p><b>q:</b> My chores are done. 🧹</p><div class="callout">I can play video games if homework is finished <b>AND</b> chores are done.</div>${table(['📚 Homework','🧹 Chores','🎮 Can play?'],combos.map(([p,q])=>[p,q,p&&q]))}<p class="rule">Memory trick: AND is picky! 🤝</p>`},
{title:'🍕 OR: Snack Time',tag:'Example 3 • OR',html:`<p><b>p:</b> Pizza is available. 🍕</p><p><b>q:</b> Cookies are available. 🍪</p><div class="callout">I have a snack option if pizza <b>OR</b> cookies are available.</div>${table(['🍕 Pizza','🍪 Cookies','😋 Snack option?'],combos.map(([p,q])=>[p,q,p||q]))}<p class="rule">OR (∨) is TRUE if AT LEAST ONE part is TRUE. Both can be true!</p>`},
{title:'👕 OR: Spirit Day',tag:'Example 4 • OR',html:`<p><b>p:</b> I wear a school shirt.</p><p><b>q:</b> I wear school colors.</p><div class="callout">I qualify for Spirit Day if I wear a school shirt <b>OR</b> school colors.</div>${table(['👕 Shirt','🎨 Colors','🎉 Qualify?'],combos.map(([p,q])=>[p,q,p||q]))}<p class="rule">OR is flexible! 🎉</p>`},
{title:'📱 NOT: Phone Charging',tag:'Example 5 • NOT',html:`<p><b>p:</b> My phone is charging.</p><p><b>NOT p:</b> My phone is NOT charging.</p>${table(['🔋 p: Charging','🚫 NOT p: Not charging'],[[true,false],[false,true]])}<p class="rule">NOT (¬) flips the truth value. 🔄</p><div class="callout">If p is TRUE, NOT p is FALSE. If p is FALSE, NOT p is TRUE.</div>`},
{title:'🐶 NOT: Buttercup!',tag:'Example 6 • NOT',html:`<p><b>p:</b> Buttercup is sleeping. 🐕💤</p><p><b>NOT p:</b> Buttercup is NOT sleeping. 🐾</p>${table(['🐶 Sleeping','🐾 NOT sleeping'],[[true,false],[false,true]])}<div class="callout">What if Buttercup is awake and chasing a ball? Then p is FALSE and NOT p is TRUE.</div>`},
{title:'☔ IF–THEN: Rainy Day',tag:'Example 7 • IF–THEN',html:`<p><b>p:</b> It rains.</p><p><b>q:</b> I take an umbrella.</p><div class="callout"><b>IF</b> it rains, <b>THEN</b> I take an umbrella.</div>${table(['🌧️ Rains','☂️ Umbrella','🤔 Rule kept?'],combos.map(([p,q])=>[p,q,!p||q]))}<p class="rule">IF–THEN (→) is FALSE only when p is TRUE and q is FALSE.</p>`},
{title:'🏫 IF–THEN: School Rule',tag:'Example 8 • IF–THEN',html:`<p><b>p:</b> Assignment submitted on time.</p><p><b>q:</b> On-time mark awarded.</p><div class="callout">IF the assignment is submitted on time, THEN the on-time mark is awarded.</div>${table(['📚 On time','⭐ Mark given','🤔 Rule kept?'],combos.map(([p,q])=>[p,q,!p||q]))}<p class="small">A late submission does not, by itself, violate the rule—whether or not a mark was given.</p>`},
{title:'🧠 All Four Rules!',tag:'Review',html:`<div class="cards"><div class="card"><b style="color:var(--red)">🔴 NOT (¬)</b><p>Flip the truth value.</p></div><div class="card"><b style="color:var(--green)">🟢 AND (∧)</b><p>Both must be true.</p></div><div class="card"><b style="color:var(--blue)">🔵 OR (∨)</b><p>At least one is true.</p></div><div class="card"><b style="color:var(--purple)">🟣 IF–THEN (→)</b><p>False only for TRUE → FALSE.</p></div></div>${table(['p','q','AND','OR','IF–THEN'],combos.map(([p,q])=>[p,q,p&&q,p||q,!p||q]))}`},
{title:'🎮 Practice Challenge!',tag:'You do',quiz:true},
{title:'📐 How does this connect to Geometry?',tag:'Apply it',html:`<p><b>IF</b> a shape is a square, <b>THEN</b> it is a rectangle. 🟢 TRUE</p><p><b>IF</b> a shape is a rectangle, <b>THEN</b> it is a square. 🔴 FALSE</p><div class="callout">A square has four right angles, so every square is a rectangle. But not every rectangle has four equal sides!</div><p>Truth tables prepare us for <b>conditional statements, converses, and proofs.</b></p>`},
{title:'🎟️ Exit Ticket',tag:'Check your learning',exit:true},
{title:'🌟 You Did It!',tag:'Wrap-up',html:`<p class="big">🟢 AND = BOTH</p><p class="big">🔵 OR = AT LEAST ONE</p><p class="big">🔴 NOT = OPPOSITE</p><p class="big">🟣 IF–THEN = BROKEN ONLY BY TRUE → FALSE</p><div class="callout">💬 Share your own everyday IF–THEN rule with the class!</div><p>Great job thinking logically! 🎉</p>`}
];
const questions=[
['🍿 I have money but NO permission. Money AND permission?',false,'AND needs both conditions.'],
['🍕 Pizza is unavailable, but cookies are available. Pizza OR cookies?',true,'OR needs at least one.'],
['📱 My phone IS charging. Is “my phone is NOT charging” true?',false,'NOT flips TRUE to FALSE.'],
['☔ It rains, but I do not take an umbrella. Is “IF rain, THEN umbrella” true?',false,'TRUE → FALSE breaks the rule.'],
['🎮 Homework AND chores are both finished. Can I play?',true,'Both conditions are true.'],
['🎵 I listen to pop AND country music. Is “pop OR country” true?',true,'Logical OR allows both to be true.'],
['🐕 Buttercup is NOT sleeping. Is “Buttercup is sleeping” true?',false,'The original statement is false.'],
['🏫 An assignment is late and no on-time mark is awarded. Is “IF on time, THEN mark” true?',true,'When the IF part is false, the conditional is true.']
];
const exitQuestions=[['When is AND true?',['At least one is true','Both are true','Both are false'],1],['What does NOT do?',['Flips true and false','Always makes a statement true','Combines two statements'],0],['When is IF–THEN false?',['When both are false','When p is false','When p is true and q is false'],2]];
let index=0;let quizAnswers={},exitAnswers={};const slide=document.getElementById('slide');
function quizMarkup(){return `<p>Choose TRUE or FALSE. You will see feedback immediately!</p>${questions.map(([q,a,why],i)=>`<div class="question"><b>${i+1}. ${q}</b><div class="choices"><button class="true ${quizAnswers[i]===true?'selected':''}" onclick="answerQuiz(${i},true)">🟢 TRUE</button><button class="false ${quizAnswers[i]===false?'selected':''}" onclick="answerQuiz(${i},false)">🔴 FALSE</button></div>${quizAnswers[i]===undefined?'':`<div class="feedback ${quizAnswers[i]===a?'ok':'no'}">${quizAnswers[i]===a?'✅ Correct!':'❌ Try again.'} ${why}</div>`}</div>`).join('')}<div class="finish">Answered ${Object.keys(quizAnswers).length} of ${questions.length} • Correct ${questions.filter((q,i)=>quizAnswers[i]===q[1]).length}</div>`}
function exitMarkup(){return `<p>Check what you remember before leaving class.</p>${exitQuestions.map(([q,opts,a],i)=>`<div class="question"><b>${i+1}. ${q}</b><div class="choices">${opts.map((opt,j)=>`<button class="${exitAnswers[i]===j?'selected':''}" onclick="answerExit(${i},${j})">${String.fromCharCode(65+j)}. ${opt}</button>`).join('')}</div>${exitAnswers[i]===undefined?'':`<div class="feedback ${exitAnswers[i]===a?'ok':'no'}">${exitAnswers[i]===a?'✅ Correct!':'❌ Try again. Think about the rule.'}</div>`}</div>`).join('')}<div class="finish">Exit ticket: ${Object.keys(exitAnswers).length}/3 answered • ${exitQuestions.filter((q,i)=>exitAnswers[i]===q[2]).length}/3 correct</div>`}
function render(){const s=slides[index];document.getElementById('counter').textContent=`Slide ${index+1} / ${slides.length}`;document.getElementById('fill').style.width=`${(index+1)/slides.length*100}%`;slide.innerHTML=`<div class="kicker">${s.tag}</div><h2>${s.title}</h2>${s.quiz?quizMarkup():s.exit?exitMarkup():s.html}`;document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===slides.length-1?'Start Over ↻':'Next →';window.scrollTo({top:0,behavior:'smooth'});}
window.answerQuiz=(i,v)=>{quizAnswers[i]=v;render()};window.answerExit=(i,v)=>{exitAnswers[i]=v;render()};document.getElementById('prev').onclick=()=>{if(index>0){index--;render()}};document.getElementById('next').onclick=()=>{if(index===slides.length-1){index=0;quizAnswers={};exitAnswers={}}else index++;render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'&&index<slides.length-1){index++;render()}if(e.key==='ArrowLeft'&&index>0){index--;render()}});render();
</script></body></html>
